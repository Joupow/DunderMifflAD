<text x="62" y="864" font-size="13.5" fill="#b91c1c" font-weight="700">Mission panne N4 · SYSVOL (DFS-R) et réplication AD sont deux moteurs distincts</text>
<text x="62" y="888" font-size="11.5" fill="#7f1d1d">Injection : service DFSR arrêté sur DC02 → GPO en version 2 sur DC01, SYSVOL de DC02 figé en version 1</text>
<text x="62" y="908" font-size="11.5" fill="#7f1d1d">Impact : WIN11-B (Utica) reste sur la version 1 de l'avis légal, alors que repadmin /replsummary ne signale rien</text>
<text x="62" y="930" font-size="11" fill="#b91c1c" font-style="italic">Diagnostic : DSVersion contre SysvolVersion, dfsrdiag, dcdiag /test:sysvolcheck · deux moteurs, deux outils</text>
