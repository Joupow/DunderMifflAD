<text x="830" y="446" font-size="11" fill="#92400e">aucun groupe métier · jamais T0/T1</text>
<text x="830" y="463" font-size="11" fill="#b45309" font-style="italic">hors organigramme · accès borné</text>
<text x="46" y="530" font-size="12.5" fill="#334155" font-weight="700">OU techniques · conteneurs d'ordinateurs, hors organigramme</text>
<rect x="45" y="544" width="502" height="84" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="59" y="568" font-size="13.5" fill="#3730a3" font-weight="700">OU=Workstations</text>
<text x="59" y="590" font-size="11" fill="#334155">WIN11-A, sorti de CN=Computers (aucun lien de GPO possible)</text>
<text x="59" y="609" font-size="11" fill="#4338ca" font-weight="700">cible de la GPO LAPS-Workstations : mot de passe admin local tournant</text>
<rect x="559" y="544" width="502" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="573" y="568" font-size="13.5" fill="#94a3b8" font-weight="700">OU=Servers</text>
<text x="573" y="590" font-size="11" fill="#94a3b8">À venir en N4, avec le premier serveur membre</text>
<rect x="45" y="646" width="502" height="160" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="59" y="672" font-size="13.5" fill="#0f766e" font-weight="700">Chaîne AGDLP · axe A → G posé en N2</text>
<text x="59" y="698" font-size="12" fill="#134e4a">Compte (amartin) → GG-Accounting (Global)</text>
<text x="59" y="720" font-size="12" fill="#134e4a">→ DL de ressource (Domain Local) → permission : en N4</text>
<text x="59" y="746" font-size="11" fill="#475569">Les GG-* métier sont créés et peuplés en N2.</text>
<text x="59" y="764" font-size="11" fill="#475569">Les DL-* n'existent qu'avec leur ressource (partages en N4).</text>
<text x="59" y="788" font-size="11" fill="#64748b" font-style="italic">un GG regroupe des personnes, un DL porte un droit</text>
<rect x="559" y="646" width="502" height="160" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="573" y="672" font-size="13.5" fill="#b91c1c" font-weight="700">Mission panne N2 · le presta oublié</text>
<text x="573" y="698" font-size="11.5" fill="#7f1d1d">Injection : expiration retirée, compte toujours actif</text>
<text x="573" y="719" font-size="11.5" fill="#7f1d1d">Impact : Bob ouvre une session et énumère l'annuaire</text>
<text x="573" y="740" font-size="11.5" fill="#7f1d1d">Détection : externes actifs sans date d'expiration</text>
<text x="573" y="761" font-size="11.5" fill="#7f1d1d">Réparation : désactivation, expiration reposée, trace</text>
<text x="573" y="788" font-size="11" fill="#b91c1c" font-style="italic">validation : logon de Bob refusé (compte expiré)</text>
<rect x="45" y="824" width="1016" height="70" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="553" y="850" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">Réseau physique inchangé depuis N1</text>
<text x="553" y="872" font-size="11" fill="#475569" text-anchor="middle">vSwitch SITE1 (Scranton) 10.10.1.0/24, isolé · DC01 .10 · DC02 .11 · WIN11-A .101 (DHCP) · aucune VM ni sous-réseau ajouté</text>
<text x="46" y="920" font-size="11" fill="#64748b">Nommage : initiale du prénom + nom (externes suffixés .ext) · UPN en @sabre.local jusqu'en N10</text>
<text x="46" y="940" font-size="11" fill="#64748b">Mot de passe administrateur local des postes géré par Windows LAPS, stocké et chiffré dans AD</text>
<text x="30" y="985" font-size="11" fill="#94a3b8">Adressage : IPAM · état : as-built fin de N2</text>
